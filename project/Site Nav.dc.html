<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Main" style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px clamp(20px,4vw,48px);font-family:'Geist',sans-serif">
  <a href="#main" style="position:absolute;left:-9999px;top:8px;background:#f5a524;color:#111214;padding:10px 14px;font:600 15px/1 'Geist',sans-serif;border-radius:4px;z-index:5" style-focus="left:16px">Skip to content</a>
  <a href="Home.dc.html" aria-label="Visual History, home" style="font:500 22px/1 'Geist',sans-serif;letter-spacing:-.03em;color:#f5f5f4;white-space:nowrap">Visual History</a>
  <sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:clamp(16px,2.2vw,30px);font:500 15px/1 'Geist',sans-serif">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" aria-current="{{ l.current }}" style="color:{{ l.color }};padding:6px 0;border-bottom:1px solid {{ l.line }};white-space:nowrap" style-hover="color:#ffc766">{{ l.label }}</a>
      </sc-for>
      <div role="group" aria-label="Language" style="display:flex;gap:2px;font:500 13px/1 'Geist Mono',monospace">
        <button onClick="{{ setEN }}" aria-pressed="{{ isEN }}" style="background:none;border:0;cursor:pointer;padding:6px 7px;font:inherit;color:{{ enColor }};border-bottom:1px solid {{ enLine }}">EN</button>
        <button onClick="{{ setNL }}" aria-pressed="{{ isNL }}" style="background:none;border:0;cursor:pointer;padding:6px 7px;font:inherit;color:{{ nlColor }};border-bottom:1px solid {{ nlLine }}">NL</button>
      </div>
      <a href="Contact.dc.html" style="font:600 15px/1 'Geist',sans-serif;color:#111214;background:#f5a524;padding:13px 18px;border-radius:6px;white-space:nowrap" style-hover="background:#ffc766">{{ cta }}</a>
    </div>
  </sc-if>
  <sc-if value="{{ narrow }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMenu }}" aria-expanded="{{ menuOpen }}" aria-controls="vh-menu" style="font:500 15px/1 'Geist',sans-serif;color:#f5f5f4;background:rgba(12,13,15,.6);border:1px solid rgba(245,245,244,.35);border-radius:6px;padding:12px 18px;cursor:pointer">Menu</button>
  </sc-if>
  <sc-if value="{{ showPanel }}" hint-placeholder-val="{{ false }}">
    <div id="vh-menu" style="position:absolute;top:100%;left:16px;right:16px;background:#1a1b1e;border:1px solid rgba(220,222,228,.18);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:6px;z-index:20">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="color:{{ l.color }};padding:12px 4px;font:500 18px/1 'Geist',sans-serif">{{ l.label }}</a>
      </sc-for>
      <div style="display:flex;gap:8px;padding:12px 0">
        <button onClick="{{ setEN }}" aria-pressed="{{ isEN }}" style="background:none;border:1px solid rgba(245,245,244,.3);border-radius:4px;cursor:pointer;padding:10px 14px;font:500 14px/1 'Geist Mono',monospace;color:{{ enColor }}">EN</button>
        <button onClick="{{ setNL }}" aria-pressed="{{ isNL }}" style="background:none;border:1px solid rgba(245,245,244,.3);border-radius:4px;cursor:pointer;padding:10px 14px;font:500 14px/1 'Geist Mono',monospace;color:{{ nlColor }}">NL</button>
      </div>
      <a href="Contact.dc.html" style="font:600 16px/1 'Geist',sans-serif;color:#111214;background:#f5a524;padding:16px 18px;border-radius:6px;text-align:center">{{ cta }}</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;experience&quot;,&quot;process&quot;,&quot;heritage&quot;,&quot;cities&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: 'en', w: 1400, open: false };
  componentDidMount() {
    try { this.setState({ lang: localStorage.getItem('vh-lang') || 'en' }); } catch (e) {}
    this.onR = () => this.setState({ w: window.innerWidth });
    this.onL = e => this.setState({ lang: e.detail });
    this.onR(); window.addEventListener('resize', this.onR); window.addEventListener('vh-lang', this.onL);
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('vh-lang', this.onL); }
  setLang(l) {
    try { localStorage.setItem('vh-lang', l); } catch (e) {}
    window.dispatchEvent(new CustomEvent('vh-lang', { detail: l }));
  }
  renderVals() {
    const nl = this.state.lang === 'nl', active = this.props.active;
    const defs = [
      ['experience', 'Experience.dc.html', 'Experience', 'Ervaring'],
      ['process', 'Process.dc.html', 'Process', 'Proces'],
      ['heritage', 'For%20Heritage%20Sites.dc.html', 'Heritage sites', 'Erfgoedsites'],
      ['cities', 'For%20Cities%20and%20Tourism.dc.html', 'Cities & tourism', 'Steden & toerisme'],
      ['about', 'About.dc.html', 'About', 'Over ons'],
    ];
    const links = defs.map(([k, href, en, nlL]) => ({
      href, label: nl ? nlL : en, current: k === active ? 'page' : undefined,
      color: k === active ? '#ffc766' : '#dcdde0', line: k === active ? '#f5a524' : 'transparent',
    }));
    const wide = this.state.w >= 1080;
    return {
      links, wide, narrow: !wide, menuOpen: this.state.open, showPanel: !wide && this.state.open,
      toggleMenu: () => this.setState(s => ({ open: !s.open })),
      cta: nl ? 'Plan een visiegesprek' : 'Book a vision meeting',
      isEN: !nl, isNL: nl,
      setEN: () => this.setLang('en'), setNL: () => this.setLang('nl'),
      enColor: nl ? '#9a9ba1' : '#f5f5f4', nlColor: nl ? '#f5f5f4' : '#9a9ba1',
      enLine: nl ? 'transparent' : '#f5a524', nlLine: nl ? '#f5a524' : 'transparent',
    };
  }
}
</script>
</body>
</html>
